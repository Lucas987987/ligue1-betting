name: Validation bayésienne (walk-forward)

# Compare le modèle bayésien au fréquentiste et au marché, en walk-forward
# (sans fuite temporelle), sur exactement les mêmes matchs. Répond à : le
# bayésien prédit-il mieux que le fréquentiste (log-loss 1.0037) ? bat-il le
# marché (0.9812) ?
#
# Réentraîne DEUX modèles par date (fréquentiste + bayésien). MAP+Laplace étant
# rapide, le walk-forward complet est faisable. Compter ~15-30 min.
#
# Hors prod : lancement manuel. Rapport dans le résumé du run.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validation-bayes
  cancel-in-progress: false

jobs:
  validate-bayes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install numpy scipy

      - name: Lancer la validation bayésienne
        run: |
          PYTHONPATH=src python -m validation.walkforward_bayes > validation_bayes_report.txt 2>&1
          cat validation_bayes_report.txt

      - name: Publier le rapport dans le résumé du run
        if: always()
        run: |
          {
            echo "## Validation bayésienne (walk-forward)"
            echo ""
            echo '```'
            cat validation_bayes_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Committer les résultats
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/validation/
          if git diff --staged --quiet; then
            echo "Résultats inchangés — rien à committer."
          else
            git commit -m "validation: walk-forward bayésien $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

