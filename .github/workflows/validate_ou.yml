name: Validation Over/Under (calibration)

# Valide la calibration des probabilités over/under du modèle, seuil par seuil
# (0.5/1.5/2.5/3.5), en walk-forward sans fuite. Compare au marché Pinnacle sur
# le seuil 2.5 (le seul avec cotes dans football-data). Dit quels seuils sont
# fiables et lesquels méritent prudence.
#
# Hors prod : lancement manuel. Réentraîne un modèle par date (~quelques min).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validation-ou
  cancel-in-progress: false

jobs:
  validate-ou:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install numpy scipy

      - name: Valider la calibration over/under
        run: |
          PYTHONPATH=src python -m validation.walkforward_ou > ou_report.txt 2>&1
          cat ou_report.txt

      - name: Publier le rapport dans le résumé du run
        if: always()
        run: |
          {
            echo "## Validation Over/Under (calibration par seuil)"
            echo ""
            echo '```'
            cat ou_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Committer les résultats
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/validation/
          if git diff --staged --quiet; then
            echo "Résultats inchangés — rien à committer."
          else
            git commit -m "validation: calibration over/under $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

