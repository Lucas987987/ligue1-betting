name: Validation forme (walk-forward)

# Valide le modèle enrichi de la forme-résidu : entraîne à chaque date un modèle
# de base ET un modèle enrichi, mesure si la forme améliore la log-loss
# (réf. bayésien 1.0009) ou si son coefficient ressort négligeable.
#
# Plus lourd que les autres validations (deux fits par date + calcul de forme).
# Compter 30-45 min selon la grille.
#
# Hors prod : lancement manuel. Verdict + coefficients dans le résumé du run.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validation-form
  cancel-in-progress: false

jobs:
  validate-form:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install numpy scipy

      - name: Lancer la validation forme
        run: |
          PYTHONPATH=src python -m validation.walkforward_form > validation_form_report.txt 2>&1
          cat validation_form_report.txt

      - name: Publier le rapport dans le résumé du run
        if: always()
        run: |
          {
            echo "## Validation forme (walk-forward)"
            echo ""
            echo '```'
            cat validation_form_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Committer les résultats
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/validation/
          if git diff --staged --quiet; then
            echo "Résultats inchangés — rien à committer."
          else
            git commit -m "validation: walk-forward forme $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

